name: Convert incoming legal PDFs

on:
  push:
    paths:
      - "incoming/**/*.pdf"
      - "incoming/**/*.PDF"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install system OCR (Chinese)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr \
            tesseract-ocr-chi-sim \
            tesseract-ocr-eng
          tesseract --list-langs
          echo "tesseract version: $(tesseract --version | head -1)"

      - name: Install Python converters
        run: |
          python -m pip install --upgrade pip
          # pymupdf = primary text-layer + render for OCR
          # markitdown = last-resort fallback
          pip install pymupdf "markitdown[pdf]"

      - name: Convert PDFs → Markdown
        run: python scripts/convert_incoming_pdfs.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add content/ incoming/ || true

          if git diff --staged --quiet; then
            echo "No content changes"
          else
            git commit -m "chore: convert incoming legal PDFs to Markdown $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push
          fi
