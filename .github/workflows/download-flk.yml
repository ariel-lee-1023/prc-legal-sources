name: Download + convert from flk.npc.gov.cn

on:
  schedule:
    # Every Sunday 02:00 UTC = 10:00 CST
    - cron: "0 2 * * 0"
  workflow_dispatch:
    inputs:
      types:
        description: "Comma-separated Chinese types (default 01+02+03+05)"
        required: false
        default: "宪法,法律,行政法规,司法解释"
      max_new:
        description: "Max new PDFs to download this run"
        required: false
        default: "40"

permissions:
  contents: write

jobs:
  download-and-convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests "markitdown[pdf]"

      - name: Download new laws (PDF → incoming/)
        run: |
          TYPES="${{ github.event.inputs.types || '宪法,法律,行政法规,司法解释' }}"
          MAX_NEW="${{ github.event.inputs.max_new || '40' }}"
          echo "types=$TYPES  max_new=$MAX_NEW"
          python scripts/download_flk.py \
            --types "$TYPES" \
            --max-new "$MAX_NEW" \
            --max-pages 15 \
            --sleep 1.5

      - name: Convert PDFs → Markdown (and delete sources)
        run: python scripts/convert_incoming_pdfs.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add content/ incoming/ sources/flk-manifest.json || true

          if git diff --staged --quiet; then
            echo "No content changes"
          else
            git commit -m "chore: flk weekly sync + convert $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push
          fi
